# Fly.io config for CodePlans. `fly launch --copy-config` picks your app name
# and region; see docs/guides/deploying.md.
#
# As written this runs SQLite on a volume (one machine). For Postgres, remove
# the [mounts] section and attach a database (sets DATABASE_URL).

app = "codeplans"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"

[[mounts]]
  source = "codeplans_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
