name: Publish CLI

# Publishes @codeplans/cli to npm. It runs after Publish Release creates a
# release, when a release is published from the GitHub UI, or by hand. The
# version in cli/package.json must match the tag (v0.7.7 → 0.7.7), and a
# version that is already on npm (or a tag from before the CLI existed) is
# skipped, so re-running and backfilling releases are safe.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the CLI from (e.g. v0.7.7)
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the version
        id: version
        run: |
          if [ ! -f cli/package.json ]; then
            echo "$TAG has no CLI; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -p "require('./cli/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::cli/package.json is $version, but the tag is $TAG"
            exit 1
          fi
          if npm view "@codeplans/cli@$version" version >/dev/null 2>&1; then
            echo "@codeplans/cli@$version is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: pnpm vitest run cli
      - name: Build and publish
        if: steps.version.outputs.skip != 'true'
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm run build
          test "$(node dist/index.js --version)" = "${TAG#v}"
          npm publish --access public --provenance
