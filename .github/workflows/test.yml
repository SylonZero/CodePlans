name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codeplans_product_access_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ':memory:'
      AUTH_SECRET: ci-only-secret-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify Postgres migrations (product access)
        env:
          PRODUCT_ACCESS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/codeplans_product_access_test
        run: pnpm exec tsx scripts/verify-product-access-postgres.ts
      - run: pnpm build
      - name: Build and pack the CLI
        run: |
          pnpm cli:pack
          node cli/dist/index.js --version
