name: Publish Release

# Publishes a GitHub release for an existing tag. Manually dispatched — used
# for backfilling releases and until release publishing is automated from
# within the app (asset-record-spec.md §8, Phase C).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish a release for (e.g. v0.4.0)
        required: true
        type: string
      target:
        description: Commit SHA to create the tag at, when it doesn't exist yet
        required: false
        type: string
      title:
        description: Release title (defaults to the tag)
        required: false
        type: string
      notes:
        description: Markdown body for the release
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$TARGET" ]; then
            gh release create "$TAG" --target "$TARGET" --title "${TITLE:-$TAG}" --notes "$NOTES"
          else
            gh release create "$TAG" --verify-tag --title "${TITLE:-$TAG}" --notes "$NOTES"
          fi
